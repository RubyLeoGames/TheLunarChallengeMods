name: Update mod list

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: 22 0 * * *
  workflow_dispatch:

concurrency:
  group: find-mods
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: go build -v ./...
    - name: Run
      run: ./TheLunarChallengeMods
    - name: Configure Git identity
      run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Update mod list
      run: |
        git switch --orphan output
        git add mods.json
        git commit -m "Update mod list"
        git push --force --set-upstream origin output
